<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#291c2c">
<title>너에게 고백하기까지 24시간</title>
<link rel="stylesheet" href="style.css">
<script src="story.js" defer></script>
<script src="game.js" defer></script>
</head>
<body>
<main id="game" aria-label="너에게 고백하기까지 24시간">
  <div id="art" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>
  <section id="title" class="screen">
    <div class="cover">
      <div class="date"><span></span> 여름방학 전 마지막 등교일</div>
      <h1>너에게<br>고백하기까지<br><em>24<span>시간</span></em></h1>
      <div class="title-menu">
        <button data-action="new" class="primary">처음부터 <span>↗</span></button>
        <button data-action="continue" id="continue">이어하기 <span>↗</span></button>
        <div class="secondary">
          <button data-action="collection">엔딩 컬렉션</button><button data-action="gallery">CG 갤러리</button>
          <button data-action="settings">설정</button><button data-action="credits">제작진</button>
        </div>
      </div>
      <p id="reward" hidden>“그러니까…… 그냥 나랑 같이 학교 가고, 저녁에 고백하면 되는 거였잖아. 대체 그동안 무슨 짓을 하고 다닌 거야?” <b>— 유이</b></p>
    </div>
  </section>
  <section id="play" class="screen" hidden>
    <button id="advance" aria-label="대화 진행"></button>
    <header id="scene-label"><time></time><span></span></header>
    <button id="show-ui" hidden aria-label="대화창 다시 표시">대화창 표시</button>
    <div id="choices" hidden></div>
    <section id="dialogue">
      <div id="speaker" hidden></div>
      <p id="line" aria-live="polite"></p><span id="next" aria-hidden="true">◆</span>
    </section>
    <nav id="quick" aria-label="플레이 메뉴">
      <button data-action="save">SAVE</button><button data-action="load">LOAD</button><button data-action="auto" aria-pressed="false">AUTO</button><button data-action="skip" aria-pressed="false">SKIP</button><button data-action="log">LOG</button><button data-action="settings">CONFIG</button><button data-action="hide" aria-label="대화창 숨기기">◫</button><button data-action="title">TITLE</button>
    </nav>
  </section>
  <section id="ending" class="screen" hidden></section>
  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>
</main>
</body>
</html>
